name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        A new RefMod Stack node with twelve fixed slots, per-channel sliders labelled with their tags, position badges and a Size control; it never resizes on its own. RefMod presets save a stack with its weights, and prompts can link to them. Chained stacks show their position and upstream labels. Right-click any tag, name or speaker ID to replace, swap or remove it in one place, one field or everywhere. Start typing a subject name and press Tab to fill it in.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
