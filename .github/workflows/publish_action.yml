name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        RefMod Create can crop to the subject and blur the background: Batch Masking finds it in every picture and clip with SAM 3.1, and the new Crop and mask window masks one picture at a time with its own word, Auto mask, dots and a brush that paints into or erases from the mask, its settings following Batch Masking until changed there. In edit mode, a Full RefMod's stored frames can have their background blurred. New Fantastic H3 Reference Map node: the Text Encode's reference_map without encoding, shown live on the node with a Copy button for pasting into an LLM. The Text Encode lists its references in the order the model reads them, with a thumbnails view. Fixes: a renamed RefMod keeps its new name in labels and reference_map; RefMod names must be unique; the stale "Audio can't be sent alone" warning is gone.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
