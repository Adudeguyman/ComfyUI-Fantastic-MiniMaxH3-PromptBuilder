name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Fixes for RefMods made from video clips: Create and Edit now take the first frames of the clip on H3's real frame grid (22 frames store 7, 39 store 12, 56 store 17) instead of evenly spaced picks that stored only 2, with a live readout under Clip frames. Deleting a RefMod closes its details panel. Reads the single-file bundles saved by ComfyUI-MiniMaxH3Mod 0.2.6.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
