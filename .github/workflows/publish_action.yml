name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        RefMods: save a character, place, look or voice once and reuse it in any prompt. New RefMod Stack, library (browse, create, edit, inspect) and RefMod Text Encode nodes, which replaces MiniMax H3 Reference to Video and takes Media Loader media and RefMods together. The Prompt Builder gets a + RefMods button, RefMod chips, a Draft from RefMods button for subject definitions and retention analysis, and draft-mode RefMods. Delivery tags are highlighted; two that didn't work were removed. Includes a step-by-step RefMods guide (REFMODS.md) and security hardening for the Comfy Registry.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
