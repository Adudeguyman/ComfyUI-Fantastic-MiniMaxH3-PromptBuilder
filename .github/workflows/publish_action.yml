name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        The trim and crop editor's size menu takes a custom long edge. stack_pictures "up to 8" is now "up to N", with stack_pictures_n setting N (default 8); workflows saved with "up to 8" need it picked again. RefMod bundles from ComfyUI-MiniMaxH3Mod can be edited, saved as a copy in standalone files with the bundle left as it is. The RefMod library has its own window and text size control. RefMod Stack cards number RefMods after the Media Loader's media with or without the Prompt Builder in between. The mask preview redraws on size and crop changes and no longer draws grow and the regenerated cells too large on a cropped clip.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
