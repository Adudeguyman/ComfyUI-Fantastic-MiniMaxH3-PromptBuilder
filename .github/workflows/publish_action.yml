name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Name your subjects with a name box and !Name shorthand. RefMods can store a subject name, appearance and voice description, and Draft from RefMods writes them into the prompt. Voice lines get a voice box, and speaker buttons can insert a line that names the voice. Draft from RefMods can start over or fill missing names and voices when everything is already drafted. The built-in Guide adds parts on using the Prompt Builder and RefMods.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
